# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

fail_fast = true
default_install_hook_types = [
  "pre-commit",
  "pre-push"
  ]

[[repos]]
repo = "meta"
hooks = [
  { id = "check-useless-excludes" }
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-symlinks" },
  { id = "check-toml" },
  { id = "check-vcs-permalinks" },
  { id = "check-yaml" },
  { id = "end-of-file-fixer" },
  {
    id = "file-contents-sorter",
    files = 'spelling_private_dict\.txt$'
  },
  { id = "trailing-whitespace" }
]

[[repos]]
repo = "https://github.com/pre-commit/pygrep-hooks"
rev = "v1.10.0"
hooks = [
  { id = "rst-backticks" },
  { id = "rst-directive-colons" },
  { id = "rst-inline-touching-normal" },
  { id = "text-unicode-replacement-char" }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "actionlint",
    name = "actionlint",
    entry = "uv run --group=dev actionlint",
    language = "python",
    pass_filenames = false,
    types_or = ["yaml"],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "pydocstringformatter",
    name = "pydocstringformatter",
    entry = "uv run --group=dev pydocstringformatter",
    language = "python",
    types_or = ["python"],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "mypy",
    name = "mypy",
    stages = ["pre-push"],
    entry = "uv run --group=dev -m mypy --num-workers=4",
    language = "python",
    types_or = [
      "python",
      "toml"
    ],
    pass_filenames = false,
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "check-manifest",
    name = "check-manifest",
    stages = ["pre-push"],
    entry = "uv run --group=dev -m check_manifest",
    language = "python",
    pass_filenames = false,
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "pyright",
    name = "pyright",
    stages = ["pre-push"],
    entry = "uv run --group=dev -m pyright .",
    language = "python",
    types_or = [
      "python",
      "toml"
    ],
    pass_filenames = false,
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "ty",
    name = "ty",
    stages = ["pre-push"],
    entry = "uv run --group=dev ty check",
    language = "python",
    types_or = [
      "python",
      "toml"
    ],
    pass_filenames = false,
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "pyrefly",
    name = "pyrefly",
    stages = ["pre-push"],
    entry = "uv run --group=dev pyrefly check",
    language = "python",
    types_or = [
      "python",
      "toml"
    ],
    pass_filenames = false,
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "vulture",
    name = "vulture",
    entry = "uv run --group=dev -m vulture .",
    language = "python",
    types_or = ["python"],
    pass_filenames = false,
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "pyroma",
    name = "pyroma",
    entry = "uv run --group=dev -m pyroma --min 10 .",
    language = "python",
    pass_filenames = false,
    types_or = ["toml"],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "interrogate",
    name = "interrogate",
    entry = "uv run --group=dev -m interrogate",
    language = "python",
    types_or = ["python"],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "deptry",
    name = "deptry",
    stages = ["pre-push"],
    entry = "uv run --group=dev deptry .",
    language = "python",
    pass_filenames = false,
    types_or = [
      "python",
      "toml"
    ],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "pylint",
    name = "pylint",
    stages = ["pre-push"],
    entry = "uv run --group=dev pylint",
    language = "python",
    types_or = ["python"],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "ruff-check-fix",
    name = "ruff check",
    entry = "uv run --group=dev ruff check --fix",
    language = "python",
    types_or = ["python"],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "ruff-format-fix",
    name = "ruff format",
    entry = "uv run --group=dev ruff format",
    language = "python",
    types_or = ["python"],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "strict-kwargs-fix",
    name = "strict-kwargs",
    entry = "uv run --group=dev strict-kwargs check --fix",
    language = "python",
    types_or = ["python"],
    additional_dependencies = ["uv==0.11.7"],
    require_serial = true
  },
  {
    id = "no-defaults",
    name = "no-defaults",
    entry = "uv run --group=dev no-defaults",
    language = "python",
    types_or = ["python"],
    additional_dependencies = ["uv==0.11.7"],
    require_serial = true
  },
  {
    id = "pyproject-fmt-fix",
    name = "pyproject-fmt",
    entry = "uv run --group=dev pyproject-fmt",
    language = "python",
    files = "pyproject.toml",
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "vale-sync",
    name = "vale sync",
    entry = "uv run --group=dev vale sync",
    language = "python",
    pass_filenames = false,
    files = '(\.(rst|md)$|^\.vale\.ini$)',
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "snapper",
    name = "snapper",
    entry = "uv run --group=snapper snapper --max-width 0 --in-place",
    language = "python",
    types_or = [
      "rst",
      "markdown"
    ],
    require_serial = true,
    additional_dependencies = ["uv==0.11.7"],
    stages = ["pre-commit"]
  },
  {
    id = "vale",
    name = "vale",
    entry = "uv run --group=dev vale",
    language = "python",
    types_or = [
      "rst",
      "markdown"
    ],
    require_serial = true,
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "doc8",
    name = "doc8",
    entry = "uv run --group=dev doc8",
    language = "python",
    types_or = ["rst"],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "sphinx-lint",
    name = "sphinx-lint",
    entry = "uv run --group=dev sphinx-lint",
    language = "python",
    types_or = ["rst"],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "yamlfix",
    name = "yamlfix",
    entry = "uv run --group=dev yamlfix",
    language = "python",
    types_or = ["yaml"],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "zizmor",
    name = "zizmor",
    entry = "uv run --group=dev zizmor .",
    language = "python",
    pass_filenames = false,
    types_or = ["yaml"],
    additional_dependencies = ["uv==0.11.7"]
  }
]
